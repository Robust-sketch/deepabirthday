
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Deepa Ma'am!</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle, #2b1055, #110326);
      font-family: 'Poppins', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 16px;
    }

    #sprinkleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: clamp(24px, 5vw, 40px) 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 7vw, 3.2rem);
      color: #ff758c;
      text-shadow: 0 0 15px rgba(255, 117, 140, 0.7);
      margin-bottom: 18px;
      line-height: 1.3;
    }

    /* Birthday person's photo */
    .birthday-photo {
      display: block;
      width: clamp(130px, 38vw, 180px);
      height: clamp(130px, 38vw, 180px);
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 4px solid #ff758c;
      margin: 0 auto 22px;
      box-shadow:
        0 0 15px rgba(255, 117, 140, 0.7),
        0 0 30px rgba(255, 126, 179, 0.5);
      animation: photoGlow 3s ease-in-out infinite alternate;
    }

    @keyframes photoGlow {
      from {
        box-shadow: 0 0 12px #ff758c;
        transform: scale(1);
      }
      to {
        box-shadow: 0 0 30px #ff758c, 0 0 45px #ff7eb3;
        transform: scale(1.04);
      }
    }

    .wish-message {
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      line-height: 1.7;
      color: #e2d4f8;
      margin-bottom: 22px;
    }

    /* Birthday cake */
    .cake-wrapper {
      position: relative;
      width: 170px;
      height: 145px;
      margin: 20px auto 28px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .cake {
      position: relative;
      width: 100%;
      height: 60%;
      background: linear-gradient(to bottom, #ff9a9e, #fecfef);
      border-radius: 12px 12px 6px 6px;
      box-shadow: inset 0 -10px rgba(0, 0, 0, 0.08),
                  0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .cake::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 25px;
      background: white;
      border-radius: 12px 12px 15px 15px;
    }

    .icing-drips {
      position: absolute;
      top: 8px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }

    .drip {
      width: 15px;
      height: 18px;
      background: white;
      border-radius: 0 0 10px 10px;
    }

    .candle {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 42px;
      background: repeating-linear-gradient(
        45deg,
        #ff5e7e,
        #ff5e7e 6px,
        white 6px,
        white 12px
      );
      border-radius: 3px 3px 0 0;
      z-index: 3;
    }

    .wick {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 8px;
      background: #444;
    }

    .flame {
      position: absolute;
      top: -25px;
      left: 50%;
      width: 16px;
      height: 23px;
      background: radial-gradient(
        ellipse at bottom,
        white 10%,
        #ffe600 40%,
        #ff5722 80%
      );
      border-radius: 50% 50% 35% 35%;
      cursor: pointer;
      transform: translateX(-50%);
      transform-origin: center bottom;
      animation: flicker 0.3s infinite alternate,
                 glow 1.5s infinite alternate;
    }

    @keyframes flicker {
      from { transform: translateX(-50%) rotate(-5deg) scaleY(0.95); }
      to { transform: translateX(-50%) rotate(5deg) scaleY(1.08); }
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 5px orange); }
      to { filter: drop-shadow(0 0 18px #ff5722); }
    }

    .flame.extinguished {
      opacity: 0;
      pointer-events: none;
      animation: none;
    }

    .wish-btn {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      border: none;
      padding: 12px 26px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .wish-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(255, 117, 140, 0.6);
    }

    .wish-btn:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    @media (max-width: 360px) {
      .card { padding: 24px 14px; }
      h1 { font-size: 1.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    
/* Birthday Photo Carousel */
.photo-carousel {
  position: relative;
  width: clamp(180px, 48vw, 230px);
  aspect-ratio: 1 / 1;
  margin: 20px auto 28px;
  border-radius: 50%;
  border: 4px solid #ff758c;
  overflow: hidden;
  box-shadow:
    0 0 15px rgba(255, 117, 140, 0.8),
    0 0 35px rgba(255, 126, 179, 0.5);
  animation: carouselGlow 3s ease-in-out infinite alternate;
}

@keyframes carouselGlow {
  from {
    box-shadow: 0 0 12px #ff758c;
  }
  to {
    box-shadow: 0 0 30px #ff758c, 0 0 45px #ff7eb3;
  }
}

.carousel-track {
  width: 100%;
  height: 100%;
  position: relative;
}

.carousel-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.08);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}

.carousel-slide.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.carousel-slide img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
}

/* Navigation buttons */
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(43, 16, 85, 0.8);
  color: white;
  font-size: 17px;
  cursor: pointer;
  z-index: 3;
  transition: background 0.3s;
}

.carousel-btn:hover {
  background: #ff758c;
}

.carousel-btn.prev {
  left: 8px;
}

.carousel-btn.next {
  right: 8px;
}

/* Slide indicators */
.carousel-dots {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 4;
}

.carousel-dots .dot {
  width: 9px;
  height: 9px;
  padding: 0;
  border: 1px solid white;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  cursor: pointer;
}

.carousel-dots .dot.active {
  background: #ff758c;
  transform: scale(1.25);
}

@media (prefers-reduced-motion: reduce) {
  .carousel-slide {
    transition: none;
  }

  .photo-carousel {
    animation: none;
  }
}

  </style>
</head>

<body>

  <canvas id="sprinkleCanvas" aria-hidden="true"></canvas>

  <main class="card">

    <h1>Happy Birthday, Deepa Ma'am! 🎉🎂</h1>
    
<!-- Birthday Photo Carousel--->
<div class="photo-carousel" id="birthdayCarousel">

  <div class="carousel-track">

    <div class="carousel-slide active">
      <img src="img1.jpg" alt="Sonali Ma'am - Photo 1">
    </div>

    <div class="carousel-slide">
      <img src="img2.jpg" alt="Sonali Ma'am - Photo 2">
    </div>

    <div class="carousel-slide">
      <img src="img3.jpg" alt="Sonali Ma'am - Photo 3">
    </div>
    <div class="carousel-slide">
      <img src="img4.jpg" alt="Sonali Ma'am - Photo 3">
    </div>
    <div class="carousel-slide">
      <img src="img5.jpg" alt="Sonali Ma'am - Photo 3">
    </div>
    

  </div>
  <!-- Previous and Next buttons --->
  <button class="carousel-btn prev"
          type="button"
          aria-label="Previous photo">&#10094;</button>

  <button class="carousel-btn next"
          type="button"
          aria-label="Next photo">&#10095;</button>
  <!-- Slide indicators --->
  <div class="carousel-dots">
    <button class="dot active" aria-label="Show photo 1"></button>
    <button class="dot" aria-label="Show photo 2"></button>
    <button class="dot" aria-label="Show photo 3"></button>
    <button class="dot" aria-label="Show photo 4"></button>
    <button class="dot" aria-label="Show photo 5"></button>
  </div>

</div>
    <p class="wish-message" id="message">
      दु:खका बादलहरू हटेर सधैं सुखको घाम लागोस्,
तिम्रो जीवनमा उमङ्गको नयाँ रङ्ग छाओस्।
हाँसिरहनु, बाँचिरहनु, यसरी नै रमाईरहनु,
प्रिय साथी, तिमीलाई जन्मदिनको लाखौँ लाख शुभकामना!! 💖
      <br><br>
      Make a wish and blow out the candle! ✨
    </p>

    <div class="cake-wrapper">

      <div class="candle">
        <div class="wick"></div>
        <div class="flame" id="candleFlame"
             title="Click to blow out the candle"></div>
      </div>

      <div class="cake">
        <div class="icing-drips">
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
        </div>
      </div>

    </div>

    <button class="wish-btn" id="wishBtn">
      Make a Wish ✨
    </button>

  </main>

  <script>
    // Falling birthday sprinkles
    const canvas = document.getElementById("sprinkleCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    let sprinkles = [];
    let blownOut = false;

    const colors = [
      "#ff758c", "#fffa65", "#32ff7e",
      "#18dcff", "#7d5fff", "#ffb8b8"
    ];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Sprinkle {
      constructor(initial = false) {
        this.reset(initial);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : -15;
        this.w = Math.random() * 4 + 3;
        this.h = Math.random() * 8 + 5;
        this.color = colors[
          Math.floor(Math.random() * colors.length)
        ];
        this.speedY = Math.random() * 2 + 1.5;
        this.speedX = Math.random() - 0.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;
      }

      update() {
        this.y += this.speedY * (blownOut ? 2.5 : 1);
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(
          -this.w / 2, -this.h / 2,
          this.w, this.h, 3
        );
        ctx.fill();
        ctx.restore();
      }
    }

    function initSprinkles() {
      sprinkles = [];
      for (let i = 0; i < 100; i++) {
        sprinkles.push(new Sprinkle(true));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      sprinkles.forEach(sprinkle => {
        sprinkle.update();
        sprinkle.draw();
      });

      requestAnimationFrame(animate);
    }

    resizeCanvas();
    initSprinkles();
    animate();

    window.addEventListener("resize", resizeCanvas);

    // Candle and wish button
    const flame = document.getElementById("candleFlame");
    const wishBtn = document.getElementById("wishBtn");
    const message = document.getElementById("message");

    function toggleWish() {
      blownOut = !blownOut;
      flame.classList.toggle("extinguished", blownOut);

      if (blownOut) {
        message.innerHTML =
          "✨ Your wish has been sent into the universe! " +
          "May all your dreams come true, Deepa Ma'am! 🎉💖";

        wishBtn.textContent = "Relight Candle 🕯️";
      } else {
        message.innerHTML =
          "दु:खका बादलहरू हटेर सधैं सुखको घाम लागोस्,
तिम्रो जीवनमा उमङ्गको नयाँ रङ्ग छाओस्।
हाँसिरहनु, बाँचिरहनु, यसरी नै रमाईरहनु,
प्रिय साथी, तिमीलाई जन्मदिनको लाखौँ लाख शुभकामना!! 💖";

        wishBtn.textContent = "Make a Wish ✨";
      }
    }

    flame.addEventListener("click", toggleWish);
    wishBtn.addEventListener("click", toggleWish);

    
/* Birthday Photo Carousel Logic */
const carousel = document.getElementById("birthdayCarousel");

const slides = carousel.querySelectorAll(".carousel-slide");
const dots = carousel.querySelectorAll(".dot");
const prevBtn = carousel.querySelector(".prev");
const nextBtn = carousel.querySelector(".next");

let currentSlide = 0;
let carouselTimer;

function showSlide(index) {
  currentSlide = (index + slides.length) % slides.length;

  slides.forEach((slide, i) => {
    slide.classList.toggle("active", i === currentSlide);
  });

  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i === currentSlide);
  });
}

function nextSlide() {
  showSlide(currentSlide + 1);
}

function prevSlide() {
  showSlide(currentSlide - 1);
}

function startCarousel() {
  clearInterval(carouselTimer);
  carouselTimer = setInterval(nextSlide, 3000);
}

nextBtn.addEventListener("click", () => {
  nextSlide();
  startCarousel();
});

prevBtn.addEventListener("click", () => {
  prevSlide();
  startCarousel();
});

dots.forEach((dot, index) => {
  dot.addEventListener("click", () => {
    showSlide(index);
    startCarousel();
  });
});

// Pause automatic sliding while the pointer is over the carousel.
carousel.addEventListener("mouseenter", () => {
  clearInterval(carouselTimer);
});

carousel.addEventListener("mouseleave", startCarousel);

// Start the slideshow
showSlide(0);
startCarousel();

  </script>

</body>
</html>
